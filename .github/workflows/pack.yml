name: Manga Scraper & Compressor

on:
  push:
    paths:
      - 'config.js'
      - 'main.js'
      - 'scraper.js'
      - 'pack.js'
  workflow_dispatch:

jobs:
  scrape-and-compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper
        run: npm start

      # Jalankan script pengelompokan CBZ ke file ZIP < 50MB
      - name: Package CBZs into <50MB Zips
        run: node pack.js

      # Upload hasil paket ke Artifacts
      - name: Upload CBZ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manga-cbz-packages
          path: split_packages/*.zip
          retention-days: 7
          